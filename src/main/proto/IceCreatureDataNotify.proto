syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

enum IceCreatureAutoReplace {
  ICE_CREATURE_AUTO_REPLACE_NONE = 0;
  ICE_CREATURE_AUTO_REPLACE_AUTO_REPLACE = 1;
  ICE_CREATURE_AUTO_REPLACE_NOT_AUTO_REPLACE = 2;
}

message IceCreatureDataNotify {
  // 7.2 PIOFANAELFP: the wheel consumes LNGEPLAGDIG into its gadget unlock set.
  repeated uint32 unlocked_gadget_id_list = 8;
  repeated IceCreatureTypeGadget type_gadget_list = 9;
}

message IceCreatureTypeGadget {
  uint32 gadget_id = 10;
  uint32 type = 12;
  IceCreatureAutoReplace auto_replace = 7;
}
