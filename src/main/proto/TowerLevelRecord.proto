syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerLevelRecordOuterClass";

message TowerLevelRecord {
	// 7.0 client reads satisfied star conds on field 4 (was wrongly field 7).
	repeated uint32 satisfied_cond_list = 4;
	uint32 level_id = 5;
}
