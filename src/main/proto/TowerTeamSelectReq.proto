syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerTeamSelectReqOuterClass";

import "TowerTeam.proto";

message TowerTeamSelectReq {
	// 7.0 client WriteTo uses field 8 (not 6 — that number belongs to TowerCurLevelRecord).
	repeated TowerTeam tower_team_list = 8;
	uint32 floor_id = 9;
}
