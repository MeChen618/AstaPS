syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "AbilityScalarValueEntry.proto";
import "BPAEPJHBOFM.proto";
import "IceCreatureGadgetInfo.proto";
import "Vector.proto";

message IceCreatureBuildReq {
  IceCreatureLimitType limit_type = 10;
  Vector pos = 1;
  repeated AbilityScalarValueEntry global_value_list = 4;
  uint32 map_layer_id = 8;
  bool unk_11 = 12;
  BPAEPJHBOFM build_detail = 2;
  Vector rot = 9;
  repeated fixed64 replace_guid_list = 11;
  uint32 gadget_id = 15;
}
