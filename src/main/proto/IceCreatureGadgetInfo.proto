syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "BPAEPJHBOFM.proto";
import "ProfilePicture.proto";
import "Vector.proto";

enum IceCreatureLimitType {
  ICE_CREATURE_LIMIT_TYPE_NONE = 0;
  ICE_CREATURE_LIMIT_TYPE_AREA_LIMIT = 1;
  ICE_CREATURE_LIMIT_TYPE_COST_LIMIT = 2;
}

message IceCreatureGadgetInfo {
  uint32 area_id = 4;
  fixed32 create_time = 7;
  string creator_nickname = 2;
  uint32 like_num = 5;
  string online_id = 13;
  uint64 guid = 15;
  uint32 gadget_id = 12;
  ProfilePicture creator_profile_picture = 11;
  uint32 unk_9 = 10;
  string xbox_gamertag = 14;
  uint32 entity_id = 9;
  uint32 creator_uid = 8;
  Vector pos = 1;
  uint32 map_layer_id = 6;
  IceCreatureGadgetDetail detail = 3;
  uint32 scene_id = 739;
  bool is_hidden = 1637;
  bool unk_1401 = 1249;
}

message IceCreatureGadgetDetail {
  bytes storage = 3;
  BPAEPJHBOFM build_detail = 13;
}
